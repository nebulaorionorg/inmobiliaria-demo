<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Propuesta independiente para Micuccio Propiedades, Ingeniero Maschwitz. Tres inmuebles con fuentes oficiales, contacto de demostración y panel simulado.">
  <meta name="theme-color" content="#bc2026">
  <title>Micuccio Propiedades | Propuesta independiente de Nebula</title>
  <link rel="icon" href="../assets/micuccio-propiedades/logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <style>
    .proposal-notice { padding: 12px 24px; background: #fff0f0; color: #79171c; text-align: center; font-size: 13px; line-height: 1.6; border-bottom: 1px solid #e9bfc2; }
    .brand-logo { width: 64px; height: 64px; object-fit: contain; }
    .hero-overlay { background: linear-gradient(180deg, #241518cc, #24151899 60%, #241518cc); }
    @media (max-width: 600px) { .proposal-notice { padding: 10px 16px; font-size: 12px; } .brand-logo { width: 54px; height: 54px; } }
  </style>
  <script src="config.js" defer></script>
  <script src="../app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Ir al contenido</a>
  <aside id="proposal-notice" class="proposal-notice" role="note">Propuesta independiente de Nebula. Sin vínculo comercial ni autorización de esta inmobiliaria.</aside>
  <header id="header" class="site-header"></header>
  <main id="main" tabindex="-1"></main>
  <footer id="footer"></footer>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="gallery" aria-label="Galería de fotografías"></dialog>
  <noscript>Esta demo necesita JavaScript para mostrar el catálogo, el contacto de demostración y el panel simulado. Activá JavaScript y volvé a abrir la página.</noscript>
</body>
</html>
